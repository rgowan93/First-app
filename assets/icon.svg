<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a6fd6"/>
      <stop offset="1" stop-color="#0e2a5c"/>
    </linearGradient>
    <linearGradient id="goldBanner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#f5c518"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Card 1 -->
  <g transform="translate(112 96) rotate(-12)">
    <rect width="180" height="260" rx="16" fill="#f0e6d2" stroke="#1a4a8a" stroke-width="6"/>
    <rect x="16" y="16" width="148" height="148" rx="8" fill="#1a4a8a"/>
    <text x="90" y="125" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="#f5c518" text-anchor="middle">H</text>
    <rect x="16" y="180" width="148" height="62" rx="6" fill="#1a4a8a"/>
    <text x="90" y="222" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="#f5c518" text-anchor="middle">HOC</text>
  </g>
  <!-- Card 2 (front) -->
  <g transform="translate(220 130) rotate(8)">
    <rect width="180" height="260" rx="16" fill="#f0e6d2" stroke="#1a4a8a" stroke-width="6"/>
    <rect x="16" y="16" width="148" height="148" rx="8" fill="url(#goldBanner)"/>
    <text x="90" y="118" font-family="Arial Black, sans-serif" font-size="60" font-weight="900" fill="#1a4a8a" text-anchor="middle">★</text>
    <text x="90" y="200" font-family="Arial Black, sans-serif" font-size="22" font-weight="900" fill="#1a4a8a" text-anchor="middle">HOUSE</text>
    <text x="90" y="226" font-family="Arial Black, sans-serif" font-size="22" font-weight="900" fill="#1a4a8a" text-anchor="middle">OF CARDS</text>
  </g>
</svg>
